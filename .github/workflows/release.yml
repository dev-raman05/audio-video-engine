name: Build and Release KaleidoSync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            cmd: npm run dist:win -- --publish never
          - os: macos-latest
            platform: mac
            cmd: npm run dist:mac -- --publish never
          - os: ubuntu-latest
            platform: linux
            cmd: npm run dist:linux -- --publish never

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check scripts
        shell: bash
        run: |
          node --check main.js
          node --check preload.js
          node --check updater.js
          for f in renderer/js/*.js; do
            node --check "$f"
          done

      - name: Build application installers
        run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Verify macOS ad-hoc code signatures (arm64 & x64)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          shopt -s nullglob
          APPS=(dist/mac*/KaleidoSync.app)
          if [ ${#APPS[@]} -lt 2 ]; then
            echo "Expected arm64 and x64 .app bundles, found: ${APPS[*]}"
            exit 1
          fi
          for app in "${APPS[@]}"; do
            echo "Verifying $app ..."
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaleidosync-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mapfile -t ASSETS < <(find release-assets -type f | sort)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found!"
            exit 1
          fi
          ls -lh "${ASSETS[@]}"

          cat <<EOF > /tmp/release-notes.md
          ## KaleidoSync ${TAG} — Cross-Platform Audio-Reactive Visual Engine

          Click the direct installer for your OS below (no zip extraction required):

          - **Windows (`x64`):** `KaleidoSync-Windows-Setup.exe` — double-click to install and run (creates Desktop & Start Menu shortcuts; if Windows SmartScreen warns about an unsigned app, click **More info → Run anyway**).
          - **macOS (`arm64` Apple Silicon M1–M5 & `x64` Intel):** `KaleidoSync-macOS-arm64.dmg` or `KaleidoSync-macOS-x64.dmg` — ad-hoc signed for Apple Silicon & Intel. Open the `.dmg`, drag **KaleidoSync** to **Applications**, then either:
            - **System Settings → Privacy & Security → Open Anyway** (after first double-click on macOS Sequoia/Tahoe) or **right-click → Open**, OR
            - Run `xattr -cr /Applications/KaleidoSync.app` in Terminal (or install via 1-line Terminal command in README to avoid browser quarantine).
            - Allow **Screen & System Audio Recording** when prompted for system audio loopback.
          - **Linux (`x64`):** `KaleidoSync-Linux-x64.AppImage` (`chmod +x KaleidoSync-Linux-x64.AppImage && ./KaleidoSync-Linux-x64.AppImage`) or `KaleidoSync-Linux-x64.deb` (`sudo apt install ./KaleidoSync-Linux-x64.deb`). On PulseAudio/PipeWire, if System Audio loopback is unavailable, pick your `Monitor of ...` device under **Microphone / Line-In**.
          EOF

          # Remove any stale or stuck draft release for this tag before publishing cleanly
          gh release delete "$TAG" --yes 2>/dev/null || true

          gh release create "$TAG" "${ASSETS[@]}" \
            --title "KaleidoSync $TAG" \
            --notes-file /tmp/release-notes.md \
            --latest
