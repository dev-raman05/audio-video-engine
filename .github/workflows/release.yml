name: Build and Release KaleidoSync

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            cmd: npm run dist:win -- --publish never
          - os: macos-latest
            platform: mac
            cmd: npm run dist:mac -- --publish never
          - os: ubuntu-latest
            platform: linux
            cmd: npm run dist:linux -- --publish never

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check scripts
        shell: bash
        run: |
          node --check main.js
          node --check preload.js
          for f in renderer/js/*.js; do
            node --check "$f"
          done

      - name: Build application installers
        run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaleidosync-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VER=$(node -p "require('./package.json').version")
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mapfile -t ASSETS < <(find release-assets -type f | sort)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found!"
            exit 1
          fi
          ls -lh "${ASSETS[@]}"

          cat <<EOF > /tmp/release-notes.md
          ## KaleidoSync ${TAG} — Cross-Platform Audio-Reactive Visual Engine

          Download the installer or archive for your operating system below:

          - **Windows (\`x64\`):** Run \`KaleidoSync-Setup-*-x64.exe\` (installer) or extract \`KaleidoSync-*-win-x64.zip\` and run \`KaleidoSync.exe\`.
          - **macOS (\`arm64\` Apple Silicon & \`x64\` Intel):** Open the matching \`.dmg\` (or \`.zip\`) and drag **KaleidoSync** to Applications. Because the app is unsigned, on first launch **right-click → Open** (or run \`xattr -cr /Applications/KaleidoSync.app\`) and allow **Screen & System Audio Recording** when prompted for system audio loopback.
          - **Linux (\`x64\`):** Run the \`.AppImage\` (\`chmod +x KaleidoSync-*.AppImage && ./KaleidoSync-*.AppImage\`), install the \`.deb\` (\`sudo apt install ./KaleidoSync-*.deb\`), or extract \`.tar.gz\`. On PulseAudio/PipeWire, if System Audio loopback is unavailable, pick your \`Monitor of ...\` device under **Microphone / Line-In**.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "KaleidoSync $TAG" \
              --notes-file /tmp/release-notes.md
          fi
